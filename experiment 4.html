<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Room Booking Form</title>
</head>
<body>
    <h1 align="center"><b>Hotel Room Booking Form</b></h1>
    <form action="#" align="center">
    <hr>


        <label for="Name">Full Name:</label>
        <input type="text" id="Name" name="Name" required><br><br>
        

        <label for="Email">Email Address:</label>
        <input type="email" id="Email" name="Email" required><br><br>

        <label for="phone No">Phone :</label>
        <input type="tel" id="phone" name="phone" required><br><br>

        <label for="checkin">Check-in Date:</label>
        <input type="date" id="checkin" name="checkin" required><br><br>

        <label for="checkout">Check-out Date:</label>
        <input type="date" id="checkout" name="checkout" required><br><br

<label for="roomtype">Room Type:</label>

        <select id="roomtype" name="roomtype">
            <option value="single">Single Room</option>
            <option value="double">Double Room</option>
            <option value="suite">Suite</option>
            <option value="deluxe">Deluxe Room</option>
            <option value="Luxury">Lxury Room</option>

        </select><br><br>

        <label for="guests">Number of Guests:</label>
        <input type="number" id="guests" name="guests" min="1" required><br><br>

        <label for="specialrequests">Special Requests:</label><br>
        <textarea id="specialrequests" name="specialrequests" rows="4" cols="50"></textarea><br><br>



        <input type="submit" value="Book Now">
        <input type="reset" value="Reset Form">





    </form>
    <hr>
    <footer align="center">
        <p>&copy; 2026 Hotel Booking Form . All rights reserved.</p>
    </footer>
</body>
</html>
